name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Python checks, frontend build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check backend scripts tests
      - run: uv run ruff format --check backend scripts tests
      - run: uv run pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: uv run playwright install --with-deps chromium
      - run: RUN_LAYOUT_CHECK=1 uv run pytest tests/test_viewport_layout.py -q
      - run: uv run python scripts/e2e_demo.py
